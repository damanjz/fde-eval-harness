<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 948" width="1600" height="948" role="img" aria-label="How a change is measured, compared and gated"><title>How a change is measured, compared and gated</title><defs><marker id="dk-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1600" height="948" rx="28" fill="#e9e9e7" data-id="canvas"/><text x="64.0" y="84.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="15" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="2" data-box="canvas">FDE PORTFOLIO · 05</text><text x="64.0" y="128.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="canvas">How a change is measured, compared and gated</text><rect x="64.0" y="281.0" width="218.9" height="352.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="change"/><text x="86.0" y="317.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="change">INPUT</text><text x="86.0" y="355.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="change">Candidate</text><text x="86.0" y="385.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="change">change</text><text x="86.0" y="419.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="change">A model or a prompt</text><text x="86.0" y="443.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="change">change</text><text x="86.0" y="467.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="change">Run against the same</text><text x="86.0" y="491.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="change">60 golden cases</text><text x="86.0" y="515.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="change">Local models only, one</text><text x="86.0" y="539.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="change">at a time</text><rect x="338.9" y="281.0" width="218.9" height="352.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="adapter"/><text x="360.9" y="317.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="adapter">ADAPTERS</text><text x="360.9" y="355.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="adapter">Suite adapter</text><text x="360.9" y="389.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="adapter">cases(), run_case(),</text><text x="360.9" y="413.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="adapter">score() per feature</text><text x="360.9" y="437.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="adapter">Calls project 1's own</text><text x="360.9" y="461.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="adapter">run_case and</text><text x="360.9" y="485.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="adapter">score_case</text><text x="360.9" y="509.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="adapter">Clock frozen, scoring</text><text x="360.9" y="533.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="adapter">code hashed</text><text x="360.9" y="557.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="adapter">Infrastructure failures</text><text x="360.9" y="581.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="adapter">count as errors, never</text><text x="360.9" y="605.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="adapter">passes</text><rect x="613.9" y="208.0" width="372.2" height="498.0" rx="16" fill="#fe6608" stroke="none" stroke-width="1.5" data-id="core"/><text x="635.9" y="244.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#141414" text-anchor="start" letter-spacing="1.5" data-box="core">HARNESS</text><text x="635.9" y="286.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="core">Standard library, no installs</text><text x="635.9" y="314.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="core">Local, INR 0 per case</text><rect x="635.9" y="334.0" width="328.2" height="154.0" rx="16" fill="#ffffff" stroke="none" stroke-width="1.5" data-id="run"/><text x="657.9" y="378.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="run">Run</text><text x="657.9" y="412.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="run">Timeout, retries, resume, preflight,</text><text x="657.9" y="436.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="run">warm-up</text><text x="657.9" y="460.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="run">Latency and tokens per case</text><rect x="635.9" y="506.0" width="328.2" height="178.0" rx="16" fill="#141414" stroke="none" stroke-width="1.5" data-id="compare"/><text x="657.9" y="550.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#e9e9e7" text-anchor="start" letter-spacing="0.0" data-box="compare">Compare</text><text x="657.9" y="584.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#c9c7c2" text-anchor="start" letter-spacing="0.0" data-box="compare">Paired by case, flips listed</text><text x="657.9" y="608.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#c9c7c2" text-anchor="start" letter-spacing="0.0" data-box="compare">Exact McNemar and exact paired</text><text x="657.9" y="632.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#c9c7c2" text-anchor="start" letter-spacing="0.0" data-box="compare">bootstrap</text><text x="657.9" y="656.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#c9c7c2" text-anchor="start" letter-spacing="0.0" data-box="compare">Wilson intervals, noise-floor mode</text><rect x="1042.1" y="196.0" width="218.9" height="280.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="gate"/><text x="1064.1" y="232.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="gate">CI</text><text x="1064.1" y="270.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="gate">Gate</text><text x="1064.1" y="304.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="gate">--max-drop and</text><text x="1064.1" y="328.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="gate">--must-pass refuse</text><text x="1064.1" y="352.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="gate">--rerun-lost K for noisy</text><text x="1064.1" y="376.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="gate">categories</text><text x="1064.1" y="400.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="gate">Exit 0 pass, 1</text><text x="1064.1" y="424.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="gate">regression, 2 not</text><text x="1064.1" y="448.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="gate">comparable</text><rect x="1042.1" y="510.0" width="218.9" height="208.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="monitor"/><text x="1064.1" y="546.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="monitor">PRODUCTION</text><text x="1064.1" y="584.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="monitor">Monitor</text><text x="1064.1" y="618.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="monitor">Per-day metrics from</text><text x="1064.1" y="642.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="monitor">request_log</text><text x="1064.1" y="666.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="monitor">Alerts need a rate shift</text><text x="1064.1" y="690.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="monitor">and a binomial test</text><rect x="1317.1" y="281.0" width="218.9" height="352.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="reports"/><text x="1339.1" y="317.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="reports">OUTPUT</text><text x="1339.1" y="355.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="reports">Reports</text><text x="1339.1" y="389.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="reports">matrix.md and</text><text x="1339.1" y="413.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="reports">matrix.html</text><text x="1339.1" y="437.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="reports">noise-floor.md and</text><text x="1339.1" y="461.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="reports">noise-floor.html</text><text x="1339.1" y="485.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="reports">monitor.md</text><text x="1339.1" y="509.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="reports">Charts are inline SVG,</text><text x="1339.1" y="533.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="reports">no external assets</text><rect x="64.0" y="768.0" width="1472.0" height="76.0" rx="16" fill="#dcdad5" stroke="none" stroke-width="1.5" data-id="band"/><text x="88.0" y="814.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="band">SQLite runs.db</text><text x="267.5" y="814.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="band">every case per run with model, git, prompt and code hash, frozen clock, latency, tokens, pass or fail, reasons</text><text x="1512.0" y="814.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#141414" text-anchor="end" letter-spacing="0.0" data-box="band">noise floor: 4 of 60 flipped</text><path d="M286.9 457.0 L332.9 457.0" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><path d="M561.9 457.0 L607.9 457.0" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><path d="M990.1 342.0 L1036.1 342.0" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><path d="M1265.1 378.5 L1311.1 378.5" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><path d="M800.0 710.0 L800.0 762.0" fill="none" stroke="#141414" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><text x="64.0" y="884.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#8c8a85" text-anchor="start" letter-spacing="0.0" data-box="canvas">Gate decisions are made on the stored runs, not on the models.</text></svg>